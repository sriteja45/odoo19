apiVersion: v1
kind: Service
metadata:
  name: {{ include "odoo-mouser-electronics.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "odoo-mouser-electronics.fullname" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8069
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}