name: Build & Deploy odoo_mouser_electronics
on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # Dynamic tag
      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # Login to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: balaai105
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dealwallet1/odoo_mouser_electronics:${{ env.TAG }}
            ghcr.io/dealwallet1/odoo_mouser_electronics:latest

      # Update Helm values
      - name: Update Helm values.yaml
        run: |
          sed -i "s/tag:.*/tag: ${TAG}/" helm/odoo-chart/values.yaml

      # Commit changes
      - name: Commit and Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add helm/odoo-chart/values.yaml

          git commit -m "Update image tag to ${TAG}" || echo "No changes to commit"

          git push origin main
