apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odoo-mouser-electronics.fullname" . }}-secret
  labels:
    {{- include "odoo-mouser-electronics.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_HOST: "{{ .Values.odoo.dbHost }}"
  DB_PORT: "{{ .Values.odoo.dbPort }}"
  DB_USER: "{{ .Values.odoo.dbUser }}"
  DB_PASSWORD: "{{ .Values.odoo.dbPassword }}"
  DB_NAME: "{{ .Values.odoo.dbName }}"
  ODOO_ADMIN_PASSWORD: "{{ .Values.odoo.adminPassword }}"
  SERPAPI_KEY: "{{ .Values.odoo.serpApiKey }}"
  GROQ_API_KEY: "{{ .Values.odoo.openaiApiKey }}"
  REDIS_HOST: "{{ .Values.odoo.redisHost }}"
  REDIS_PORT: "{{ .Values.odoo.redisPort }}"
  REDIS_PASSWORD: "{{ .Values.odoo.redisPassword }}"
  REDIS_DB: "{{ .Values.odoo.redisDb }}"
  AI_API_URL: "{{ .Values.odoo.aiApiUrl }}"
  AI_AUTH_TOKEN: "{{ .Values.odoo.authToken }}"
  FASTAPI_CHAT_URL: "{{ .Values.odoo.fastapiChatUrl }}"